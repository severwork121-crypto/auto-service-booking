<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>АвтоСервис — Запись</title>

    <style>
      /* Pre-React loader */
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: #04060a;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        transition: opacity 0.4s ease;
      }

      #initial-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .initial-loader__rings {
        position: relative;
        width: 64px;
        height: 64px;
      }

      .initial-loader__ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid transparent;
        border-top-color: #4690FF;
        animation: loaderSpin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      }

      .initial-loader__ring--2 {
        inset: 8px;
        border-top-color: rgba(70, 144, 255, 0.6);
        animation-duration: 1.6s;
        animation-direction: reverse;
      }

      .initial-loader__ring--3 {
        inset: 16px;
        border-top-color: rgba(70, 144, 255, 0.3);
        animation-duration: 0.9s;
      }

      .initial-loader__dot {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 6px;
        height: 6px;
        margin: -3px 0 0 -3px;
        border-radius: 50%;
        background: #4690FF;
        box-shadow: 0 0 16px #4690FF;
        animation: loaderPulse 1.4s ease-in-out infinite;
      }

      .initial-loader__label {
        font-size: 12px;
        letter-spacing: 0.18em;
        color: rgba(255, 255, 255, 0.4);
        text-transform: uppercase;
        font-weight: 500;
      }

      @keyframes loaderSpin {
        to { transform: rotate(360deg); }
      }

      @keyframes loaderPulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.7); }
      }
    </style>
  </head>
  <body>
    <div id="initial-loader">
      <div class="initial-loader__rings">
        <div class="initial-loader__ring"></div>
        <div class="initial-loader__ring initial-loader__ring--2"></div>
        <div class="initial-loader__ring initial-loader__ring--3"></div>
        <div class="initial-loader__dot"></div>
      </div>
      <div class="initial-loader__label">Загрузка</div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
